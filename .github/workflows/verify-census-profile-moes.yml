name: Verify published Census profile MOEs
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-published-profile-moes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimum HTTP dependency
        run: python -m pip install 'requests==2.32.5'
      - name: Retrieve direct DC education count MOEs for variance diagnosis
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_DATA_API }}
        run: python 06_Methodology/Phase2/fetch_phase2i_dc_direct_education_moe.py
      - name: Archive independently published profile values
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase2i-dc-education-direct-count-moe
          path: |
            06_Methodology/Phase2/ACS_DC_*_Direct_Education_Profile_Count_Official.json
            06_Methodology/Phase2/PHASE2I_DC_DIRECT_EDUCATION_COUNT_MOE.csv
          if-no-files-found: error
          retention-days: 30
